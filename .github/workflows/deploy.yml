# Builds the game and publishes it to GitHub Pages on every push to main.
# Nothing is committed by this: `dist/` is built here and handed straight to
# Pages, so the repository only ever holds source.
name: Deploy

on:
  push:
    branches: [main]
  # A push made by a workflow does not start another workflow, so the quarterly
  # player refresh has to hand the deploy over itself.
  workflow_run:
    workflows: ['Refresh players']
    types: [completed]
  # lets you re-publish by hand from the Actions tab without a new commit
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A push that lands while a deploy is running waits for it rather than racing
# it; queued runs in between are dropped, since only the newest matters.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # a refresh that failed has nothing worth publishing
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` installs exactly what package-lock.json pins, so the build on
      # the server is the build you tested.
      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
